<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F2EA" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Nebula</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23A54D31'/%3E%3Cpath d='M12 28V12l16 16V17' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='11' r='2.4' fill='%23F6C9B1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="brand-logo" viewBox="0 0 40 40">
<rect width="40" height="40" rx="11" fill="#A54D31"/>
<path d="M12 28V12l16 16V17" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="28" cy="11" r="2.4" fill="#F6C9B1"/>
</symbol>
</defs>
</svg>

<div class="app" id="app">
<aside class="sidebar" id="sidebar" aria-label="Conversations">
<div class="side-head">
<div class="brand">
<svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><use href="#brand-logo"/></svg>
<div class="brand-text"><strong>Nebula</strong></div>
</div>
<button class="icon-btn mobile-only" id="closeSidebar" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<button class="new-chat" id="newChat"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
<div class="mode-seg" id="modeSeg" role="tablist" aria-label="Mode"><button type="button" role="tab" data-mode="chat" class="on" aria-selected="true">Chat</button><button type="button" role="tab" data-mode="build" aria-selected="false">Build</button></div>
<div class="search-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="searchInput" placeholder="Search" aria-label="Search chats" autocomplete="off" spellcheck="false" />
</div>
<div class="chat-list" id="chatList"></div>
<div class="side-foot">
<button class="foot-btn" id="openSettings">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
Settings
</button>
<button class="icon-btn" id="themeToggle" aria-label="Toggle theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
</div>
</aside>

<main class="main">
<div class="fab-row">
<button class="fab" id="toggleSidebar" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8h16M4 16h10"/></svg></button>
<div class="fab-pill"><button class="fab-i" id="benchFab" type="button" aria-label="Workbench" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button><button class="fab-i" id="newChatFab" type="button" aria-label="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button class="fab-i" id="moreFab" type="button" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.500" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="12" cy="18.500" r="1.800"/></svg></button></div>
</div>
<div class="messages" id="messages" role="region" aria-label="Conversation"><div class="msgs-inner" id="msgsInner"></div></div>
<button class="scroll-btn" id="scrollBtn" aria-label="Scroll to bottom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
<div class="composer">
<div class="composer-inner">
<div class="model-pop" id="modelPop"></div>
<div class="att-tray" id="attTray" hidden></div>
<textarea id="input" rows="1" placeholder="Message" aria-label="Message" spellcheck="false"></textarea>
<div class="composer-bottom">
<div class="cb-left">
<button class="chip icon-chip" id="attachBtn" type="button" aria-label="Attach"></button>
<button class="chip" id="modelChip"><span class="txt" id="modelChipText">—</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
<button class="chip web-btn" id="webBtn" type="button" aria-pressed="false" aria-label="Web search"></button>
</div>
<div class="cb-right">
<button class="mic-btn" id="micBtn" type="button" aria-pressed="false" aria-label="Dictate" hidden></button>
<button class="send-btn" id="sendBtn" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>
</div>
</div>
</div>
<input type="file" id="fileIn" multiple hidden>
<div class="dropzone" id="dropZone" aria-hidden="true"><div class="dz-card">Drop to attach</div></div>
</main>
<aside class="viewer" id="viewer" aria-label="Artifact viewer"></aside>
</div>

<section class="spage" id="spage" role="dialog" aria-modal="true" aria-label="Settings" aria-hidden="true">
<header class="sp-bar">
<button class="icon-btn" id="spBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<h2 id="spTitle">Settings</h2>
<span class="sp-spacer"></span>
</header>
<div class="sp-body" id="spBody"></div>
</section>

<section class="live" id="liveHud" role="dialog" aria-modal="true" aria-label="Live voice" aria-hidden="true" data-state="idle">
<header class="lv-top"><button class="icon-btn" id="lvClose" type="button" aria-label="Close"></button><div class="lv-model" id="lvModel"></div><button class="icon-btn" id="lvGear" type="button" aria-label="Voice settings"></button></header>
<div class="lv-stage"><canvas id="lvOrb" aria-hidden="true"></canvas><div class="lv-state" id="lvState" aria-live="polite"></div><div class="lv-hint" id="lvHint"></div></div>
<div class="lv-caps"><p class="lv-user" id="lvUser"></p><p class="lv-ai" id="lvAi"></p></div>
<div class="lv-dock"><button class="lv-btn" id="lvCap" type="button" aria-label="Captions" aria-pressed="true"></button><button class="lv-btn big" id="lvMute" type="button"></button><button class="lv-btn end" id="lvEnd" type="button" aria-label="End"></button></div>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/01-core.js"></script>
<script src="js/01b-custom-providers.js"></script>
<script src="js/02-markdown.js"></script>
<script src="js/02b-math.js"></script>
<script src="js/02c-highlight.js"></script>
<script src="js/03-storage.js"></script>
<script src="js/04-chat.js"></script>
<script src="js/05-providers.js"></script>
<script src="js/06-settings.js"></script>
<script src="js/06b-settings-page.js"></script>
<script src="js/06c-attach.js"></script>
<script src="js/06d-voice.js"></script>
<script src="js/06e-live.js"></script>
<script src="js/07-features.js"></script>
<script src="js/07b-web.js"></script>
<script src="js/07c-ui.js"></script>
<script src="js/07d-build-core.js"></script>
<script src="js/07e-build-ui.js"></script>
<script src="js/08-boot.js"></script>
</body>
</html>
